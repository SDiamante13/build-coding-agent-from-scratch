name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Node lines package.json "engines" admits, on every platform an attendee brings.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    defaults:
      run:
        shell: bash # Git Bash on Windows, which is what the workshop asks attendees to use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # main ships lesson 1 built and lessons 2-10 red by design; solution has them all.
      - name: Acceptance tests
        run: |
          if [ "${{ github.ref_name }}" = solution ]; then
            npm test
          else
            npx vitest run test/lesson-01-single-turn.test.ts
          fi

      # No key in CI, so the furthest env-check can get is OpenRouter rejecting a bogus one —
      # which still runs every check before it, including the Node heredoc, on this platform.
      - name: env-check
        run: |
          printf 'OPENROUTER_API_KEY=sk-or-ci-bogus\nOPENROUTER_MODEL=%s\n' \
            "$(sed -n 's/^OPENROUTER_MODEL=//p' .env.example)" > .env
          if ${{ runner.os == 'Windows' && 'sh env-check' || './env-check' }} | tee env-check.out; then
            echo "env-check should have stopped at the bogus key" && exit 1
          fi
          grep -q 'OpenRouter rejected the key' env-check.out
